# GPU-server env: vLLM serving the generative models (Qwen3-8B + LFM2).
# Sized for a CUDA 12.4 driver (nvidia-smi shows "CUDA Version: 12.4", i.e. 12040).
#
# Create the env, then install vLLM's CUDA 12.8 wheel (works on a 12.4 driver):
#   micromamba create -f environment-gpu.yml -y && micromamba activate pii-vllm-gpu
#   VLLM_VERSION=$(curl -s https://api.github.com/repos/vllm-project/vllm/releases/latest | jq -r .tag_name | sed 's/^v//')
#   ARCH=$(uname -m)   # x86_64 or aarch64
#   uv pip install \
#     "https://github.com/vllm-project/vllm/releases/download/v${VLLM_VERSION}/vllm-${VLLM_VERSION}+cu128-cp38-abi3-manylinux_2_35_${ARCH}.whl" \
#     --extra-index-url https://download.pytorch.org/whl/cu128
#
# WHY the explicit wheel: vLLM ships a compiled CUDA kernel, so the vLLM WHEEL's CUDA matters,
# not just torch -- and --torch-backend only sets torch. vLLM's default wheel is now CUDA 13
# (cu130) -> "ImportError: libcudart.so.13" on a 12.x driver. The cu128 wheel is CUDA 12.8
# (libcudart.so.12) and runs on a 12.4 driver via minor-version compatibility (driver >= R525).
# vLLM publishes cu128/cu129/cu130 per release, so you keep the LATEST vLLM (no downgrade).
#   - verify: python -c "import vllm, torch; print(torch.version.cuda, torch.cuda.is_available())"
#   - alternative: upgrade the driver to R580+ (CUDA 13), then default `pip install vllm` works.
#
# Serve (two endpoints):
#   vllm serve LiquidAI/LFM2-350M-PII-Extract-JP --port 8001
#   vllm serve Qwen/Qwen3-8B --port 8000
name: pii-vllm-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cuda-version=12.4     # pin CUDA runtime to the driver's ceiling
  - uv                    # installs vLLM + a driver-matched torch wheel
