# GPU-server env: vLLM serving the generative models (Qwen3-8B + LFM2).
# Sized for a CUDA 12.4 driver (nvidia-smi shows "CUDA Version: 12.4", i.e. 12040).
#
# Create + install vLLM with a DRIVER-MATCHED torch:
#   micromamba create -f environment-gpu.yml -y
#   micromamba activate pii-vllm-gpu
#   uv pip install vllm --torch-backend=cu128    # any cu12x build; NEVER cu130
#
# Rule for a CUDA 12.4 driver: "any cu12x, never cu13x". A CUDA-12 runtime (cu121/cu126/cu128/
# cu129) runs on a 12.4 driver via CUDA minor-version compatibility (driver >= R525). CUDA 13
# (cu130) does NOT -> "ImportError: libcudart.so.13" (needs driver R580+).
#   - Do NOT use --torch-backend=auto: it falls back to the default (cu130) if it can't read
#     the driver at install time.
#   - Modern torch dropped cu124 wheels, so cu124 resolves to a nearby cu12x (e.g. cu129) --
#     that's expected and fine. Pin cu128 (broad coverage) or cu126.
#   - verify: python -c "import torch; print(torch.version.cuda, torch.cuda.is_available())"
#   - still False? older vLLM: uv pip install "vllm==0.6.*" --torch-backend=cu121, or upgrade driver.
#
# We deliberately do NOT install pytorch via conda here, to avoid a double-torch conflict;
# vLLM+torch are installed together by uv with the cu124 backend.
#
# Serve (two endpoints):
#   vllm serve LiquidAI/LFM2-350M-PII-Extract-JP --port 8001
#   vllm serve Qwen/Qwen3-8B --port 8000
name: pii-vllm-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cuda-version=12.4     # pin CUDA runtime to the driver's ceiling
  - uv                    # installs vLLM + a driver-matched torch wheel
