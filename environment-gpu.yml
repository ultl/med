# GPU-server env: vLLM serving the generative models (Qwen3-8B + LFM2).
# Sized for a CUDA 12.4 driver (nvidia-smi shows "CUDA Version: 12.4", i.e. 12040).
#
# Create + install vLLM with a DRIVER-MATCHED torch:
#   micromamba create -f environment-gpu.yml -y
#   micromamba activate pii-vllm-gpu
#   uv pip install vllm --torch-backend=cu124    # PIN EXPLICITLY to the 12.4 driver
#
# Do NOT use --torch-backend=auto: if it can't read the driver at install time it falls back
# to the ecosystem default (now cu130 = CUDA 13), which fails at import with
# "ImportError: libcudart.so.13" because the 12.4 driver has no CUDA 13 runtime.
#   - no cu124 wheel for that vLLM release? use --torch-backend=cu126 (runs on a 12.4 driver
#     via CUDA minor-version compatibility). Never cu130 on this driver.
#   - torch<->vLLM ABI mismatch? pin an older line: uv pip install "vllm==0.6.*" --torch-backend=cu124
#   - verify: python -c "import torch; print(torch.version.cuda, torch.cuda.is_available())"
#
# We deliberately do NOT install pytorch via conda here, to avoid a double-torch conflict;
# vLLM+torch are installed together by uv with the cu124 backend.
#
# Serve (two endpoints):
#   vllm serve LiquidAI/LFM2-350M-PII-Extract-JP --port 8001
#   vllm serve Qwen/Qwen3-8B --port 8000
name: pii-vllm-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cuda-version=12.4     # pin CUDA runtime to the driver's ceiling
  - uv                    # installs vLLM + a driver-matched torch wheel
